name: Create and publish a Docker image
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/hytky

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Get current branch and exit if not main
        run: |
          raw=$(git branch -r --contains ${{ github.ref }})
          branch=${raw##*/}
          echo "{name}=branch" >> $GITHUB_OUTPUT
          echo "Branch is $branch."
          if [ "$branch" != "main" ]; then
            echo "Not on main branch, exiting."
            exit 0
          fi

      - name: Log in to the Container registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          file: docker/Dockerfile.prod
          secrets: | # pass insensitive buildtime variables to docker
            "NEXT_PUBLIC_TG_INFO_CHANNEL=${{ vars.NEXT_PUBLIC_TG_INFO_CHANNEL }}"

  deploy:
    name: Deploy to Production
    needs: build-and-push-image
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout h-space repository
        uses: actions/checkout@v7.0.1
        with:
          repository: LeeviHalme/h-space
          ref: main
          path: h-space-src
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Install dependencies and build h-space
        working-directory: h-space-src
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm run build
          elif [ -f package-lock.json ]; then
            npm ci
            npm run build
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile
            yarn build
          else
            echo "No supported lockfile found."
            exit 1
          fi

      - name: Verify and package static export
        run: |
          test -f h-space-src/out/index.html
          tar -czf h-space.tar.gz -C h-space-src/out .

      - name: Upload h-space export
        uses: appleboy/scp-action@v0.1.7
        with:
          host: hytky.org
          username: dettmann
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          source: h-space.tar.gz
          target: /tmp/

      - name: Pull and restart updated containers
        uses: appleboy/ssh-action@v1.2.5
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        with:
          host: hytky.org
          username: dettmann
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          envs: DOMAIN
          script: |
            # Publish h-space static export
            mkdir -p /tmp/h-space-staging &&
            tar -xzf /tmp/h-space.tar.gz -C /tmp/h-space-staging &&
            sudo mkdir -p /opt/webapp/docker/h-space &&
            sudo rsync -a --delete /tmp/h-space-staging/ /opt/webapp/docker/h-space/ &&
            rm -rf /tmp/h-space-staging /tmp/h-space.tar.gz

            until curl -sf https://hytky.org/api/health; do sleep 10; done
            sudo git -C /opt/webapp checkout docker/nginx-conf/user_conf.d/tls.conf
            sudo git -C /opt/webapp pull
            sudo sed -i "s/sub.yourdomain.org/$DOMAIN www.$DOMAIN/g" /opt/webapp/docker/nginx-conf/user_conf.d/tls.conf
            cd /opt/webapp/docker
            docker compose --env-file /opt/webapp/.env -f docker-compose.prod.tls-registry.yml pull
            docker compose --env-file /opt/webapp/.env -f docker-compose.prod.tls-registry.yml up -d --remove-orphans
            docker compose --env-file /opt/webapp/.env -f docker-compose.prod.tls-registry.yml restart nginx
