name: push-apply

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tofu-fmt:
    name: Tofu Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'infrastructure'
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup Tofu
        uses: opentofu/setup-opentofu@v2.0.0
        with:
          tofu_version: '1.7.0'
      - name: Run Tofu
        run: tofu fmt -check

  tofu-apply:
    name: Tofu Apply Change
    needs: tofu-fmt
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: 'infrastructure'
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Tofu
        uses: opentofu/setup-opentofu@v2.0.0

      - name: Init
        run: tofu init
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

      - name: Validate
        run: tofu validate

      - name: Apply
        env:
          TF_VAR_GITHUB_SERVER_URL: ${{ github.server_url }}
          TF_VAR_GITHUB_REPOSITORY: ${{ github.repository }}
          TF_VAR_do_token: ${{ secrets.DO_PAT }}
          TF_VAR_pub_key: ${{ secrets.PUB_KEY }}
          TF_VAR_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TF_VAR_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          TF_VAR_NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          TF_VAR_NEXT_PUBLIC_TG_BOT_NAME: ${{ secrets.NEXT_PUBLIC_TG_BOT_NAME }}
          TF_VAR_NEXT_PUBLIC_TG_INFO_CHANNEL: ${{ secrets.NEXT_PUBLIC_TG_INFO_CHANNEL }}
          TF_VAR_TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TF_VAR_FORUM_ROOT_NAME: ${{ secrets.FORUM_ROOT_NAME }}
          TF_VAR_TG_ACTIVE_GROUP_IDS: ${{ secrets.TG_ACTIVE_GROUP_IDS }}
          TF_VAR_TG_ADMIN_GROUP_IDS: ${{ secrets.TG_ADMIN_GROUP_IDS }}
          TF_VAR_GOOGLEVERIFICATION: ${{ secrets.GOOGLEVERIFICATION }}
          TF_VAR_DKIM: ${{ secrets.DKIM }}
          TF_VAR_DOMAIN: ${{ secrets.DOMAIN }}
          TF_VAR_CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          TF_VAR_ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
          TF_VAR_CALENDAR_GOOGLE_CLIENT_ID: ${{ secrets.CALENDAR_GOOGLE_CLIENT_ID }}
          TF_VAR_CALENDAR_GOOGLE_CLIENT_SECRET: ${{ secrets.CALENDAR_GOOGLE_CLIENT_SECRET }}
          TF_VAR_CALENDAR_GOOGLE_REFRESH_TOKEN: ${{ secrets.CALENDAR_GOOGLE_REFRESH_TOKEN }}
          TF_VAR_CALENDAR_GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          TF_VAR_INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          TF_VAR_deploy_key: ${{ secrets.DEPLOY_PUB_KEY }}
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: tofu apply -input=false -auto-approve

      - name: Verify web access
        run: |
          echo "Checking https://hytky.org/api/health ..."
          for i in $(seq 1 6); do
            if curl -sf --max-time 10 https://hytky.org/api/health; then
              echo "Web: OK"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Web health check failed after all retries"
          exit 1

      - name: Verify SSH access
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          echo "$DEPLOY_SSH_PRIVATE_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            dettmann@hytky.org \
            "echo 'SSH: OK'"
          rm -f /tmp/deploy_key
