name: Prettier Code Style Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  prettier-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 19

      - name: Install dependencies
        run: npm install -g pnpm && pnpm install

      - name: Run Prettier
        run: pnpx prettier . --check
