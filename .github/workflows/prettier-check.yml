name: Prettier Code Style Check

on:
  push:
    paths-ignore:
      - 'infrastructure/**'
      - 'ansible/**'
      - 'docs/**'
      - '**.md'
      - '.github/**'
  pull_request:
    paths-ignore:
      - 'infrastructure/**'
      - 'ansible/**'
      - 'docs/**'
      - '**.md'
      - '.github/**'

permissions:
  contents: read

jobs:
  prettier-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install -g pnpm && pnpm install

      - name: Run Prettier
        run: pnpx prettier . --check
