server {
        listen 80;
        listen [::]:80;

        root /var/www/html;
        index index.html index.htm index.nginx-debian.html;

        server_name 0.0.0.0;

        location / {
                proxy_pass http://hytky:3000;
        }

        location ~ /.well-known/acme-challenge {
                allow all;
                root /var/www/html;
        }
}

server {
    listen 80;
    listen [::]:80;

    server_name h.hytky.org;

    root /var/www/h-space;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
